# Local infrastructure for AutoBuy.
#   docker compose up -d
# Then set in backend/.env:
#   DATABASE_URL=postgresql+asyncpg://autobuy:autobuy@localhost:5432/autobuy
#   REDIS_URL=redis://localhost:6379/0

services:
  postgres:
    image: postgres:16-alpine
    container_name: autobuy-postgres
    environment:
      POSTGRES_USER: autobuy
      POSTGRES_PASSWORD: autobuy
      POSTGRES_DB: autobuy
    ports:
      - "5432:5432"
    volumes:
      - autobuy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobuy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autobuy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  autobuy-pgdata:
